# Configuration for Flavor-Aware Healthier Recipe Substitution
# All thresholds, seeds, parameters, and paths are centrally maintained here.

project:
  name: "flavor-aware-recipe-substitution"
  version: "2.0.0"
  random_seed: 42

# Data paths
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  reports_dir: "reports"
  results_dir: "results"
  labels_dir: "labels"
  notebooks_dir: "notebooks"
  
  # External / local files
  food_com_raw: "data/raw/RAW_recipes.csv"
  recipedb_raw: "data/raw/recipedb.csv"
  flavordb_raw: "data/raw/flavordb.json"

# Leakage-safe split parameters
splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  # Sub-split of train into Statistics (S) and Model-training (M) sets
  train_stats_s_ratio: 0.60
  train_model_m_ratio: 0.40
  split_seed: 42

# Definition of "Healthier"
healthier_criteria:
  target_nutrient_min_drop_pct: 15.0      # Target nutrient must drop by >= 15% (relative)
  protein_max_change_pct: 20.0            # Protein must stay within 20% of original
  preserve_dietary_style: true            # Must preserve dietary style (vegan, vegetarian, etc.)
  primary_target_nutrients:
    - "calories"
    - "saturated_fat"
  secondary_target_nutrients:             # Optional / IF TIME
    - "sugar"
    - "sodium"

# Statistical evaluation parameters
evaluation:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  top_k_ranks: [1, 5, 10]
  hand_check_sample_size: 50
  hand_check_accuracy_target: 0.90        # 90% accuracy target for parser
